services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:20.19.6-alpine3.21}
        PNPM_VERSION: ${PNPM_VERSION:-10.30.2}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: qq-farm-bot:20260924e
    container_name: qq-farm-bot
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - sso-backends
    volumes:
      - ./core/data:/app/core/data
    tmpfs:
      - /tmp:mode=1777
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - ADMIN_HOST=0.0.0.0
      - ADMIN_PORT=3007
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3007/api/game-version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sso-backends:
    external: true
